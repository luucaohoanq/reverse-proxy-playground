# --- Định nghĩa format log đẹp hơn ---
log_format main_json escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/access.log main_json;
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name _;

    # Tự động redirect HTTP → HTTPS
    return 301 https://$host$request_uri;

}

server {
    listen 443 ssl http2; # Bật HTTP/2
    server_name _;
    # server_name myapp.com www.myapp.com; # Thay _ bằng domain thật

    #ssl_certificate     /etc/ssl/private/fullchain.pem;
    #ssl_certificate_key /etc/ssl/private/privkey.pem;

    # Cấu hình SSL/TLS mạnh mẽ hơn
    ssl_certificate     /etc/ssl/private/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (bắt buộc trình duyệt dùng HTTPS trong 6 tháng)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS / bảo mật thêm nếu muốn
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Serve frontend (React, Vue...)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy backend Spring Boot
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
